# Codecov configuration
#
# Coverage is produced by the standalone "coverage" job in build.yml (split out
# from the build/binary job so `go test -coverprofile` no longer slows the
# build). The profile is generated with `go test -coverprofile=coverage.out`
# in the backend directory.
#
# Project target is 80%: the backend's handlers/storage packages contain many
# branches that are only reachable through a live DB error or an S3/cgo backend,
# which the in-memory SQLite + local-storage unit tests cannot exercise. Patch
# coverage stays strict at 85% so new code is well covered.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 85%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "backend/main.go"
  - "backend/debug_pprof.go"
  - "backend/debug_disabled.go"

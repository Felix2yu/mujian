# pnpm 的设置集中在本文件；package.json 顶层的 "overrides" 是 npm 字段，pnpm 不读。
packages:
  - '.'

overrides:
  # 0.7.x 已修 CVE，但 SvelteKit 3 要求 cookie 的 named export（parseCookie 等），
  # 只有 2.x 才有；继续钉在 0.7.x 会让 kit 3 在 prerender 阶段抛
  # "parseCookie is not a function"。
  cookie: ^2.0.1
  # eslint 10.14 仍依赖 minimatch 10.x，而 10.2.6 有 glob 放大的 DoS 漏洞
  # （GHSA-g3hv-75wg-m249，修复版 11.0.1）。11 仍导出 eslint 用到的
  # Minimatch，lint/build 已验证；等 eslint 上游升级后可移除本条。
  minimatch: ^11.0.1

name: Build

# Runner images are pinned to explicit Ubuntu versions on purpose. The Go
# binary is CGO-linked against the runner's glibc but runs inside the image
# built from ./Dockerfile (debian:13-slim, an *older* glibc). glibc is
# backward- but NOT forward-compatible: a binary linked against a newer glibc
# than the runtime image fails at startup with "GLIBC_2.x not found". The
# `ubuntu-latest` label silently moved from 24.04 to 26.04 between 2026-10-19
# and 2026-11-19 (24.04 = glibc 2.39, 26.04 = glibc 2.42), which would have
# flipped that relation with no workflow change — and the docker job cannot
# catch it, because it only builds and pushes. Hence: explicit labels
# everywhere, plus the "Verify glibc compatibility" step in the build job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly security-refresh build: the only run that busts the apt layer
  # (see the CACHEBUST build-arg in the docker job), so base-package fixes
  # land even when nothing was pushed that week.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04,     label: amd64 }
          - { os: ubuntu-26.04-arm, label: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Copy frontend dist to backend
        run: cp -r frontend/dist backend/dist

      - name: Build backend
        run: CGO_ENABLED=1 go build -o mujian .
        working-directory: backend

      # The binary is dynamically linked against the *runner's* glibc but runs
      # inside ./Dockerfile's base image. Fail here, with a readable message,
      # if the binary needs a newer glibc than that image provides — otherwise
      # the breakage only surfaces when someone starts the published container.
      # The runtime version is read from the Dockerfile instead of hardcoded,
      # so bumping the base image automatically relaxes this check.
      - name: Verify glibc compatibility with the runtime image
        working-directory: backend
        run: |
          set -euo pipefail
          command -v readelf >/dev/null || sudo apt-get install -y -q binutils
          base=$(awk '/^FROM[[:space:]]/{print $2; exit}' ../Dockerfile)
          required=$(readelf -V ./mujian | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1 || true)
          available=$(docker run --rm --entrypoint sh "$base" -c 'ldd --version | head -1' | awk '{print $NF}')
          echo "runtime image $base provides glibc $available; binary requires up to ${required:-none}"
          echo "build runner: $(ldd --version | head -1)"
          if [ -n "$required" ]; then
            newest=$(printf '%s\n%s\n' "$required" "$available" | sort -V | tail -1)
            if [ "$newest" != "$available" ]; then
              echo "::error::binary requires glibc $required but the runtime image ($base) only provides $available — bump FROM in Dockerfile or pin the runner to an older Ubuntu"
              echo "symbols needing GLIBC_$required:"
              objdump -T ./mujian | grep "GLIBC_$required" || true
              exit 1
            fi
          fi

      # Upload the prebuilt Go binary for this architecture. The Docker job
      # downloads it instead of compiling inside the image.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: mujian-${{ matrix.label }}
          path: backend/mujian
          retention-days: 7

      # Frontend output is arch-independent, so upload it only once (from the
      # amd64 build) to avoid duplicate artifact names in the run.
      - name: Upload frontend dist
        if: matrix.label == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    # Run coverage in its own job so `go test -coverprofile` does not slow down
    # the build/binary job.
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      # Only test internal packages. The `main` package uses `//go:embed all:dist`
      # and cannot compile without a frontend build, which this job skips on
      # purpose. `main` is already vetted and built in the `build` job.
      - name: Test backend with coverage
        run: CGO_ENABLED=1 go vet ./internal/... && CGO_ENABLED=1 go test ./internal/... -coverprofile=coverage.out
        working-directory: backend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker:
    runs-on: ${{ matrix.runner }}
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write
      actions: read

    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-26.04,     label: amd64 }
          - { platform: linux/arm64, runner: ubuntu-26.04-arm, label: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Weekly cache-buster bucket (ISO week, e.g. 2026-W35). All builds within
      # one week share the same value, so the apt layer below stays cached for
      # every push of the week and rebuilds exactly once per week — when it
      # re-resolves current security fixes. (It used to be github.run_id,
      # which invalidated every layer after FROM on every push: 0% cache.)
      - name: Compute weekly cache-buster
        id: cachebust
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
          # v8 defaults digest-mismatch to "error", but our artifacts are
          # uploaded by upload-artifact@v7 (no digest metadata), so the check
          # trips even when the download itself succeeds. Keep the pre-v8
          # behavior until upload-artifact gains matching support.
          digest-mismatch: warn

      - name: Download prebuilt binary
        uses: actions/download-artifact@v8
        with:
          name: mujian-${{ matrix.label }}
          path: bin
          digest-mismatch: warn

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ matrix.label }}
          # Weekly bucket (see above): the apt layer re-resolves security
          # fixes once per week; every other build that week reuses cache.
          build-args: |
            CACHEBUST=${{ steps.cachebust.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,scope=${{ matrix.label }},mode=max

  docker-manifest:
    runs-on: ubuntu-26.04
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.repo.outputs.name }}:latest \
            ghcr.io/${{ steps.repo.outputs.name }}:amd64 \
            ghcr.io/${{ steps.repo.outputs.name }}:arm64
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }} \
            ghcr.io/${{ steps.repo.outputs.name }}:amd64 \
            ghcr.io/${{ steps.repo.outputs.name }}:arm64

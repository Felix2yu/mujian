name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Copy frontend dist to backend
        run: cp -r frontend/dist backend/dist

      - name: Build backend
        run: CGO_ENABLED=1 go build -o mujian .
        working-directory: backend

      # Upload the prebuilt Go binary for this architecture. The Docker job
      # downloads it instead of compiling inside the image.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: mujian-${{ matrix.label }}
          path: backend/mujian
          retention-days: 7

      # Frontend output is arch-independent, so upload it only once (from the
      # amd64 build) to avoid duplicate artifact names in the run.
      - name: Upload frontend dist
        if: matrix.label == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Run coverage in its own job so `go test -coverprofile` does not slow down
    # the build/binary job.
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      # Only test internal packages. The `main` package uses `//go:embed all:dist`
      # and cannot compile without a frontend build, which this job skips on
      # purpose. `main` is already vetted and built in the `build` job.
      - name: Test backend with coverage
        run: CGO_ENABLED=1 go vet ./internal/... && CGO_ENABLED=1 go test ./internal/... -coverprofile=coverage.out
        working-directory: backend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker:
    runs-on: ${{ matrix.runner }}
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      actions: read

    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest,    label: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, label: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Pull the prebuilt frontend assets and the Go binary produced by the
      # `build` job. The Docker build only assembles the final image — no
      # Node/pnpm toolchain, no Go compilation.
      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      - name: Download prebuilt binary
        uses: actions/download-artifact@v7
        with:
          name: mujian-${{ matrix.label }}
          path: bin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ matrix.label }}
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,scope=${{ matrix.label }},mode=max

      # Vulnerability gate on the freshly pushed image. Unfixed CVEs (no
      # upstream patch yet — currently most of the ubuntu base image findings)
      # are ignored so the gate only blocks fixable HIGH/CRITICAL issues.
      # Pinned to the v0.36.0 commit SHA: trivy-action suffered a tag
      # force-push supply-chain attack in March 2026; never reference it by
      # mutable tag.
      #
      # The action has no "platform" input and its remote mode always resolves
      # the amd64 manifest, so pull this job's arch first (auth comes from the
      # earlier docker/login step) and scan it via the local daemon.
      - name: Pull built image
        run: docker pull --platform ${{ matrix.platform }} ghcr.io/${{ steps.repo.outputs.name }}:${{ matrix.label }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}:${{ matrix.label }}
          format: table
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"
          severity: HIGH,CRITICAL

  docker-manifest:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.repo.outputs.name }}:latest \
            ghcr.io/${{ steps.repo.outputs.name }}:amd64 \
            ghcr.io/${{ steps.repo.outputs.name }}:arm64
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }} \
            ghcr.io/${{ steps.repo.outputs.name }}:amd64 \
            ghcr.io/${{ steps.repo.outputs.name }}:arm64

name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-amd64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          - { os: macos-latest, label: darwin-arm64 }
          - { os: windows-latest, label: windows-amd64 }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/dist

      - name: Build backend (Unix)
        if: runner.os != 'Windows'
        run: CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o mujian-${{ matrix.label }} .
        working-directory: backend

      - name: Build backend (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:CGO_ENABLED=1
          go build -trimpath -ldflags="-s -w" -o mujian-${{ matrix.label }}.exe .
        working-directory: backend

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: backend/mujian-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/mujian-*

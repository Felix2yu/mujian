name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-26.04,     label: linux-amd64 }
          - { os: ubuntu-26.04-arm, label: linux-arm64 }
          - { os: macos-latest, label: darwin-arm64 }
          - { os: windows-latest, label: windows-amd64 }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/dist

      # Same rationale as build.yml: CGO links the Linux binaries against the
      # runner's glibc, so compile them in a pinned image (bookworm = glibc
      # 2.36) instead of inheriting whatever Ubuntu the runner happens to be.
      # That also keeps the floor low for people running these binaries on
      # older distributions.
      - name: Build backend (Linux, pinned glibc)
        if: runner.os == 'Linux'
        working-directory: backend
        run: |
          modcache=$(go env GOMODCACHE)
          mkdir -p "$modcache"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/..:/src" -w /src/backend \
            -v "$modcache:/go/pkg/mod" \
            -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOTOOLCHAIN=local \
            -e CGO_ENABLED=1 \
            golang:1.27-bookworm \
            go build -trimpath -ldflags="-s -w" -o mujian-${{ matrix.label }} .

      - name: Build backend (macOS)
        if: runner.os == 'macOS'
        working-directory: backend
        run: CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o mujian-${{ matrix.label }} .

      - name: Build backend (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:CGO_ENABLED=1
          go build -trimpath -ldflags="-s -w" -o mujian-${{ matrix.label }}.exe .
        working-directory: backend

      # These binaries are downloaded and run directly on user machines, so the
      # glibc floor they require is a distribution-compatibility fact worth
      # recording: Ubuntu 22.04 = 2.35, Debian 12 = 2.36. Informational only —
      # it never fails the release, it just makes the floor visible in the log.
      - name: Report glibc requirement
        if: runner.os == 'Linux'
        working-directory: backend
        run: |
          command -v readelf >/dev/null || sudo apt-get install -y -q binutils
          required=$(readelf -V ./mujian-${{ matrix.label }} | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)
          echo "::notice::${{ matrix.label }} requires ${required:-no} GLIBC symbols (Ubuntu 22.04 ships 2.35, Debian 12 ships 2.36)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: backend/mujian-*

  release:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/mujian-*

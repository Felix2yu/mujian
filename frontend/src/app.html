<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
	<meta name="description" content="记录和管理你的现场演出体验" />
	<!-- 主题色由应用内的偏好决定（auto/light/dark 三档，见 lib/stores.js），
	     不是跟着系统外观走，所以这里用单一静态声明 + JS 覆盖，
	     而不是像纯跟随系统那样写 media 分档——后者会在「系统浅色 + 应用内深色」时选错色。 -->
	<meta name="theme-color" content="#991B1B" />

	<!-- 可安装（PWA）。iOS 认不下 SVG 图标，apple-touch-icon 必须是满幅不透明的 PNG。 -->
	<link rel="manifest" href="/manifest.webmanifest" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="幕间" />
	<meta name="format-detection" content="telephone=no" />

	<link rel="icon" href="/icons/favicon.ico" sizes="16x16 32x32 48x48" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
	<title>幕间 - 现场演出记录</title>
	<script>
		(function() {
			var theme = localStorage.getItem('theme') || 'auto';
			var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
			if (dark) document.documentElement.classList.add('dark');
			else document.documentElement.classList.add('light');
		})();
	</script>
	<script>
		// 注册 Service Worker（仅线上环境，本地 dev 跳过以免缓存干扰热更新）
		if ('serviceWorker' in navigator && !/^localhost$|^127\.0\.0\.1$|^\[::1\]$/.test(location.hostname)) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('/sw.js').catch(function () {});
			});
		}
	</script>
	%sveltekit.head%
</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

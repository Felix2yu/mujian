# =============================================================================
# 幕间（MuJian）— Nginx 指标采集配套配置
# =============================================================================
#
# 采集器通过增量解析 access log 得到「请求量 / 响应时间 / 错误数」三类指标。
# 本文件提供所需的 log_format，以及可选的 stub_status 与 logrotate 配合说明。
#
# 部署位置：
#   - log_format  必须放在 nginx.conf 的 http { } 块内
#   - access_log  放在对应站点的 server { } 块内
#   改完后先 `nginx -t` 校验，再 `systemctl reload nginx`（reload 不中断连接）。
#
# 说明：本配置只影响日志格式，不改动任何代理行为、路由或超时设置，
#       因此对现有服务无业务影响。
# =============================================================================


# -----------------------------------------------------------------------------
# 1. 日志格式（放在 http { } 块内）
# -----------------------------------------------------------------------------
# 字段设计与采集器的解析约定：
#
#   $remote_addr [$time_local] p=$uri urt=$upstream_response_time \
#   s=$status b=$body_bytes_sent rt=$request_time
#
# 为什么用 k=v 标签形式而不是默认的 combined 格式：
#   combined 格式里 $http_user_agent 含空格，按空格切分后字段位置不固定，
#   无法稳定定位状态码。标签形式让采集器可以「从行尾定位」这三个必定为单
#   token 的字段（rt / b / s），从而对任意 UA、URL 都稳定可靠。
#
# 字段顺序是有意为之：urt 放在 s/b 之前，因为当存在多个上游时
# $upstream_response_time 会输出 "0.100, 0.200"（含空格）。把它放在状态码
# 之前，可确保 s/b/rt 三个字段在行尾的位置永远不受影响。
#
# 有意省略了 $http_referer 与 $http_user_agent：单人使用场景下这两个字段对
# 指标无价值，去掉可显著降低日志体积（约 -40%）与解析开销。
log_format mujian escape=default
    '$remote_addr [$time_local] p=$uri '
    'urt=$upstream_response_time s=$status b=$body_bytes_sent rt=$request_time';


# -----------------------------------------------------------------------------
# 2. 启用该格式（放在对应站点的 server { } 块内）
# -----------------------------------------------------------------------------
# 建议写入独立文件，与默认 access_log 并存，避免影响既有日志消费方。
#
#     access_log  /var/log/nginx/mujian.access.log  mujian  buffer=64k flush=5s;
#
# buffer/flush 说明：
#   - 开启缓冲可显著降低低性能设备上的磁盘写放大（J4105 上尤其明显）
#   - flush=5s 意味着日志最多延迟 5 秒落盘；采集器按 60s 间隔读取，
#     且会自动跳过末尾未写完的半行，因此不会读到截断记录
#   - 若你希望指标更实时，去掉 buffer 参数即可


# -----------------------------------------------------------------------------
# 3. 可选：stub_status（提供累计连接数，非必需）
# -----------------------------------------------------------------------------
# 采集器默认不依赖它。若想额外观察 Nginx 的连接排队情况，可开放：
#
#     server {
#         listen 127.0.0.1:8081;
#         server_name 127.0.0.1;
#         location /nginx_status {
#             stub_status;
#             allow 127.0.0.1;
#             deny all;
#         }
#     }
#
# 注意只监听 127.0.0.1，不要暴露到内网以外。


# -----------------------------------------------------------------------------
# 4. logrotate 配合（/etc/logrotate.d/nginx）
# -----------------------------------------------------------------------------
# 采集器通过「inode 变化 + 文件变小」自动识别日志轮转，轮转后会从新文件
# 头部重新读取，因此与标准 logrotate 无需额外协调。
#
# 唯一注意点：使用 logrotate 默认的 create 方式（轮转后新建文件）即可，
# 不要用 copytruncate —— copytruncate 会先清空再原地写入，inode 不变，
# 采集器会误判为「文件被截断」，虽然也能恢复（重置偏移为 0），
# 但当轮转与采集恰好重叠时可能丢失少量样本。
#
# 推荐配置：
#
#     /var/log/nginx/mujian.access.log {
#         daily
#         rotate 14
#         compress
#         delaycompress
#         missingok
#         notifempty
#         create 0640 www-data adm
#         sharedscripts
#         postrotate
#             [ -f /run/nginx.pid ] && kill -USR1 $(cat /run/nginx.pid)
#         endscript
#     }
#
# 14 天 × 单人使用量的日志通常只有几 MB，对磁盘无压力。
